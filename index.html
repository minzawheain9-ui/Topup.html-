    let tempAppLogoBase64 = '';

    function applySavedAppLogo() {
        const savedLogo = localStorage.getItem('atom_custom_logo');
        if (savedLogo) {
            ['auth-logo-img', 'header-logo-img'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.src = savedLogo;
                    el.style.display = 'inline-block';
                }
            });
        }
    }

    function handleAppLogoChange(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempAppLogoBase64 = e.target.result;
                const preview = document.getElementById('admin-logo-preview');
                if (preview) {
                    preview.src = tempAppLogoBase64;
                    preview.style.display = 'block';
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function saveAppLogo() {
        if (!currentUser || currentUser.role !== 'admin') return;
        if (!tempAppLogoBase64) {
            alert('ကျေးဇူးပြု၍ ပုံအသစ် ရွေးချယ်ပေးပါ။');
            return;
        }
        localStorage.setItem('atom_custom_logo', tempAppLogoBase64);
        applySavedAppLogo();
        alert('Topup App ပုံအသစ်ကို ပြောင်းလဲသိမ်းဆည်းပြီးပါပြီ။');
    }

    function getOperatorVisibility() {
        return JSON.parse(localStorage.getItem('atom_op_visibility')) || {
            mytel: false,
            u9: false,
            mpt: false
        };
    }

    function toggleOperatorVisibility(op) {
        if (!currentUser || currentUser.role !== 'admin') return;
        const vis = getOperatorVisibility();
        vis[op] = !vis[op];
        localStorage.setItem('atom_op_visibility', JSON.stringify(vis));
        applyOperatorVisibilityUI();
    }

    function applyOperatorVisibilityUI() {
        const vis = getOperatorVisibility();
        ['mytel', 'u9', 'mpt'].forEach(op => {
            const tabBtn = document.getElementById(`tab-${op}`);
            const toggleBtn = document.getElementById(`btn-toggle-${op}`);
            const secEl = document.getElementById(`sec-${op}`);

            if (tabBtn) {
                tabBtn.classList.toggle('hidden', !vis[op]);
            }
            if (!vis[op] && secEl && secEl.classList.contains('active')) {
                secEl.classList.remove('active');
                document.getElementById('sec-bill').classList.add('active');
                document.querySelectorAll('#shop-tabs .tab-btn').forEach((b, i) => {
                    b.classList.toggle('active', i === 0);
                });
            }
            if (toggleBtn) {
                if (vis[op]) {
                    toggleBtn.innerText = 'ပေါ်နေသည် (Shown)';
                    toggleBtn.className = 'btn-unblock';
                } else {
                    toggleBtn.innerText = 'ဖျောက်ထားသည် (Hidden)';
                    toggleBtn.className = 'btn-block';
                }
            }
        });
    }

    function updateBuyerAccount() {
        if (!currentUser || currentUser.role !== 'buyer') return;
        if (isPhoneBlocked(currentUser.phone)) {
            alert(BLOCKED_PHONE_MESSAGE);
            logout();
            return;
        }

        const newPhone = document.getElementById('edit-buyer-phone').value.trim();
        const newPass = document.getElementById('edit-buyer-pass').value.trim();

        if (!newPhone || newPhone.length < 9) {
            alert('မှန်ကန်သော ဖုန်းနံပါတ်အသစ် ထည့်ပါ။');
            return;
        }
        if (isPhoneBlocked(newPhone)) {
            alert(BLOCKED_PHONE_MESSAGE);
            return;
        }
        if (!/^\d{6}$/.test(newPass)) {
            alert('Password အသစ်သည် ဂဏန်း ၆ လုံး အတိအကျ ဖြစ်ရပါမည်။');
            return;
        }

        let users = getRegisteredUsers();
        const duplicatePhone = users.find(u => u.phone === newPhone && u.phone !== currentUser.phone);
        if (duplicatePhone) {
            alert('ဤဖုန်းနံပါတ်ကို အခြားအကောင့်တွင် အသုံးပြုပြီးသား ဖြစ်ပါသည်။');
            return;
        }

        const oldPhone = currentUser.phone;
        users = users.map(u => {
            if (u.phone === oldPhone) {
                return { ...u, phone: newPhone, pass: newPass };
            }
            return u;
        });
        saveRegisteredUsers(users);

        currentUser = { ...currentUser, phone: newPhone, pass: newPass };
        localStorage.setItem('atom_user', JSON.stringify(currentUser));
        document.getElementById('welcome-user').innerText = `${currentUser.name} (${currentUser.phone})`;
        alert('အကောင့် ဖုန်းနံပါတ် နှင့် Password ကို ပြောင်းလဲသိမ်းဆည်းပြီးပါပြီ။');
    }

    function getMessages() {
        return JSON.parse(localStorage.getItem('atom_messages')) || [];
    }

    function saveMessages(msgs) {
        localStorage.setItem('atom_messages', JSON.stringify(msgs));
    }

    function sendMessageToAdmin() {
        if (!currentUser || currentUser.role !== 'buyer') return;
        if (isPhoneBlocked(currentUser.phone)) {
            alert(BLOCKED_PHONE_MESSAGE);
            logout();
            return;
        }
        const textEl = document.getElementById('buyer-msg-input');
        const msgText = (textEl ? textEl.value : '').trim();
        if (!msgText) {
            alert('ကျေးဇူးပြု၍ Admin ဆီသို့ ပို့လိုသော စာကို ရိုက်ထည့်ပါ။');
            return;
        }

        const msgs = getMessages();
        msgs.unshift({
            id: 'MSG-' + Date.now().toString().slice(-5),
            senderName: currentUser.name,
            senderPhone: currentUser.phone,
            message: msgText,
            adminReply: '',
            repliedAt: '',
            time: new Date().toLocaleString()
        });
        saveMessages(msgs);

        if (textEl) textEl.value = '';
        renderMessages();
        alert('Admin ဆီသို့ စာပို့ပြီးပါပြီ။ Admin မှ ပြန်လည်ဖြေရှင်းပေးပါမည်။');
    }

    function handleAdminReplyInput(index, val) {
        if (!window.adminReplyDrafts) window.adminReplyDrafts = {};
        window.adminReplyDrafts[index] = val;
    }

    function sendAdminReply(index) {
        if (!currentUser || currentUser.role !== 'admin') return;
        const msgs = getMessages();
        const target = msgs[index];
        if (!target) return;

        const inputEl = document.getElementById(`admin-reply-input-${index}`);
